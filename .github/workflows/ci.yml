name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: نصب
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: تست‌ها (کاملاً آفلاین)
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
        run: python -m pytest -q
      - name: بررسی کامپایل ماژول‌ها
        run: python -m compileall -q src
      - name: دموی انتها-به-انتها با داده‌ی ساختگی
        run: |
          tradeagent --root . demo --cycles 2 --step 120
          test -f var/demo/*/reports/latest.md
